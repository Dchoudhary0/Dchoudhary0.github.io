<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="dc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a0b8"/>
      <stop offset="45%" stop-color="#d4547a"/>
      <stop offset="100%" stop-color="#9b5a8a"/>
    </linearGradient>
    <radialGradient id="moon" cx="78%" cy="22%" r="18%">
      <stop offset="0%" stop-color="#fdf8f5"/>
      <stop offset="100%" stop-color="#fdf8f5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#dc-bg)"/>
  <rect width="600" height="400" fill="url(#moon)"/>
  <circle cx="468" cy="88" r="34" fill="#fdf8f5" opacity="0.85"/>
  <!-- sparkles -->
  <g fill="#fff" opacity="0.8">
    <circle cx="120" cy="80" r="2"/><circle cx="200" cy="140" r="1.5"/>
    <circle cx="340" cy="60" r="2.5"/><circle cx="420" cy="180" r="1.5"/>
    <circle cx="90" cy="200" r="1.5"/><circle cx="520" cy="140" r="2"/>
    <circle cx="280" cy="110" r="1.5"/><circle cx="160" cy="250" r="2"/>
  </g>
  <!-- castle silhouette -->
  <g fill="#fdf8f5" opacity="0.35">
    <rect x="250" y="200" width="100" height="140"/>
    <polygon points="250,200 300,150 350,200"/>
    <rect x="230" y="240" width="30" height="100"/>
    <polygon points="230,240 245,210 260,240"/>
    <rect x="340" y="240" width="30" height="100"/>
    <polygon points="340,240 355,210 370,240"/>
  </g>
  <text x="300" y="180" font-family="Georgia, serif" font-size="46" fill="#fff" text-anchor="middle" font-weight="bold" letter-spacing="2">DREAM</text>
  <text x="300" y="230" font-family="Georgia, serif" font-size="46" fill="#fff" text-anchor="middle" font-weight="bold" letter-spacing="2">COLLISION</text>
  <text x="300" y="270" font-family="Georgia, serif" font-size="16" fill="#fdf8f5" text-anchor="middle" font-style="italic" opacity="0.9">a dreamy browser escape game</text>
  <text x="300" y="330" font-size="22" text-anchor="middle">🌸 ✦ 🎀 ✦ 🌸</text>
</svg>
