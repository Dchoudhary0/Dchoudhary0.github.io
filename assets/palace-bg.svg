<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Twilight sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a5c"/>
      <stop offset="22%" stop-color="#6b4a7a"/>
      <stop offset="45%" stop-color="#b06a92"/>
      <stop offset="68%" stop-color="#e39bb4"/>
      <stop offset="100%" stop-color="#f6c9d8"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="35%" stop-color="#fdeec9"/>
      <stop offset="100%" stop-color="#fdeec9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="castleGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f3d9ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a3e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="castleBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe0f5"/>
      <stop offset="100%" stop-color="#c9a9d8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d4e0"/>
      <stop offset="50%" stop-color="#f8dde8"/>
      <stop offset="100%" stop-color="#e8b8cf"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe8f5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f3d4e0" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="120" cy="80" r="2.2" opacity="0.9"/><circle cx="260" cy="140" r="1.4" opacity="0.7"/>
    <circle cx="400" cy="60" r="1.8" opacity="0.8"/><circle cx="540" cy="120" r="1.2" opacity="0.6"/>
    <circle cx="700" cy="70" r="2" opacity="0.85"/><circle cx="880" cy="110" r="1.4" opacity="0.7"/>
    <circle cx="1040" cy="60" r="1.8" opacity="0.8"/><circle cx="1180" cy="130" r="1.3" opacity="0.6"/>
    <circle cx="1340" cy="90" r="2.2" opacity="0.9"/><circle cx="1480" cy="150" r="1.5" opacity="0.7"/>
    <circle cx="200" cy="220" r="1.3" opacity="0.6"/><circle cx="620" cy="200" r="1.5" opacity="0.7"/>
    <circle cx="980" cy="230" r="1.3" opacity="0.6"/><circle cx="1420" cy="250" r="1.6" opacity="0.7"/>
    <circle cx="340" cy="300" r="1.2" opacity="0.5"/><circle cx="1120" cy="300" r="1.4" opacity="0.6"/>
  </g>

  <!-- Moon with glow -->
  <circle cx="1200" cy="180" r="200" fill="url(#moonGlow)"/>
  <g>
    <circle cx="1200" cy="180" r="80" fill="#fff6e4"/>
    <circle cx="1240" cy="150" r="78" fill="url(#sky)"/>
  </g>

  <!-- Distant castle glow -->
  <ellipse cx="300" cy="340" rx="320" ry="200" fill="url(#castleGlow)"/>

  <!-- Castle silhouette (left, glowing) -->
  <g opacity="0.92">
    <!-- main keep -->
    <rect x="200" y="230" width="110" height="200" fill="url(#castleBody)"/>
    <polygon points="200,230 255,150 310,230" fill="#d9b8e8"/>
    <!-- towers -->
    <rect x="150" y="280" width="55" height="150" fill="url(#castleBody)"/>
    <polygon points="150,280 177,220 205,280" fill="#d9b8e8"/>
    <rect x="305" y="280" width="55" height="150" fill="url(#castleBody)"/>
    <polygon points="305,280 332,220 360,280" fill="#d9b8e8"/>
    <rect x="110" y="330" width="40" height="100" fill="#dcc3e8"/>
    <polygon points="110,330 130,285 150,330" fill="#cda8dd"/>
    <rect x="360" y="330" width="40" height="100" fill="#dcc3e8"/>
    <polygon points="360,330 380,285 400,330" fill="#cda8dd"/>
    <!-- lit windows -->
    <g fill="#fff2c9" opacity="0.85">
      <rect x="245" y="280" width="20" height="34" rx="10"/>
      <rect x="167" y="320" width="14" height="24" rx="7"/>
      <rect x="325" y="320" width="14" height="24" rx="7"/>
    </g>
  </g>

  <!-- Pink flowering arch (left frame) -->
  <g>
    <path d="M0 0 Q140 150 90 430 Q60 650 0 900 L0 0 Z" fill="#d98bb0" opacity="0.55"/>
    <g fill="#f5a8c8">
      <circle cx="40" cy="120" r="26"/><circle cx="90" cy="180" r="30"/><circle cx="55" cy="250" r="24"/>
      <circle cx="100" cy="320" r="28"/><circle cx="45" cy="400" r="26"/><circle cx="95" cy="480" r="30"/>
      <circle cx="55" cy="560" r="24"/><circle cx="100" cy="640" r="28"/><circle cx="50" cy="720" r="26"/>
    </g>
    <g fill="#fcc9dd">
      <circle cx="70" cy="150" r="16"/><circle cx="75" cy="285" r="15"/><circle cx="70" cy="440" r="16"/>
      <circle cx="78" cy="600" r="15"/><circle cx="72" cy="760" r="16"/>
    </g>
  </g>

  <!-- Right pillar with roses -->
  <g>
    <rect x="1500" y="0" width="100" height="620" fill="#efe0f5" opacity="0.6"/>
    <g fill="#f5a8c8">
      <circle cx="1500" cy="140" r="28"/><circle cx="1540" cy="220" r="26"/><circle cx="1510" cy="300" r="30"/>
      <circle cx="1545" cy="390" r="26"/><circle cx="1505" cy="470" r="28"/>
    </g>
  </g>

  <!-- Waterfall / water -->
  <path d="M120 430 Q400 430 760 450 L800 560 Q400 540 120 560 Z" fill="url(#water)" opacity="0.7"/>

  <!-- Marble floor with glossy reflection -->
  <rect x="0" y="560" width="1600" height="340" fill="url(#floor)"/>
  <!-- floor shine -->
  <g opacity="0.5" fill="#ffffff">
    <ellipse cx="1200" cy="700" rx="260" ry="40"/>
    <ellipse cx="400" cy="760" rx="300" ry="36"/>
  </g>
  <!-- faint moon reflection on floor -->
  <ellipse cx="1200" cy="650" rx="60" ry="20" fill="#fff6e4" opacity="0.35"/>
  <!-- floor diamond pattern -->
  <g stroke="#e0a8c4" stroke-width="1.2" opacity="0.4">
    <line x1="0" y1="640" x2="1600" y2="600"/>
    <line x1="0" y1="720" x2="1600" y2="690"/>
    <line x1="0" y1="810" x2="1600" y2="790"/>
    <line x1="300" y1="900" x2="500" y2="560"/>
    <line x1="700" y1="900" x2="820" y2="560"/>
    <line x1="1100" y1="900" x2="1160" y2="560"/>
  </g>

  <!-- Soft overall vignette -->
  <rect width="1600" height="900" fill="url(#castleGlow)" opacity="0.15"/>
</svg>
